input {
  file {
    path => "/var/log/app/service.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_app"
    codec => "json"
    tags => ["app", "logstash"]
  }
}

filter {
  mutate {
    add_field => { "shipper" => "logstash" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logstash-%{+YYYY.MM.dd}"
  }
}
