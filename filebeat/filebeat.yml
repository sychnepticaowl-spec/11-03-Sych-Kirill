filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      shipper: filebeat
      service: nginx
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/app/service.log
    json.keys_under_root: true
    json.add_error_key: true
    fields:
      shipper: filebeat
      service: demo-app
    fields_under_root: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  indices:
    - index: "nginx-filebeat-%{+yyyy.MM.dd}"
      when.equals:
        service: "nginx"
    - index: "app-filebeat-%{+yyyy.MM.dd}"
      when.equals:
        service: "demo-app"

setup.template.enabled: false
setup.ilm.enabled: false

logging.level: info
